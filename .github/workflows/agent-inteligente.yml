name: Atualizar Agente Ninho

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar atualização
        run: node .github/scripts/update-agent.mjs
      - name: Validar JavaScript
        run: |
          node --check app.js
          node --check server.js
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js server.js sw.js
          git commit -m "Torna Agente Ninho inteligente com IA" || exit 0
          git push
