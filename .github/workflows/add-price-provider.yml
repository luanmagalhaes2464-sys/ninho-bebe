name: Instalar provedor de preços

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/add_brightdata_price_fallback.py'

permissions:
  contents: write

jobs:
  instalar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Aplicar integração
        run: python3 .github/scripts/add_brightdata_price_fallback.py
      - name: Validar JavaScript
        run: |
          node --check price-monitor.js
          node --check server.js
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-monitor.js server.js
          git commit -m "Integra provedor de preços para Mercado Livre" || exit 0
          git push
