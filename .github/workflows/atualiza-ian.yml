name: Atualizar identidade para Ian

on:
  push:
    paths:
      - '.github/workflows/atualiza-ian.yml'

permissions:
  contents: write

jobs:
  atualizar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Atualizar textos e perfil
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('app.js'),
              Path('index.html'),
              Path('manifest.webmanifest'),
              Path('README.md'),
              Path('server.js'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              text = text.replace('Ian ou Luísa', 'Ian')
              text = text.replace('Ian/Luísa', 'Ian')
              if path.name == 'app.js':
                  text = text.replace("sex:'Ainda não sabemos'", "sex:'Menino'")
              path.write_text(text, encoding='utf-8')

          sw = Path('sw.js')
          text = sw.read_text(encoding='utf-8')
          import re
          text = re.sub(r"const CACHE = 'ninho-[^']+';", "const CACHE = 'ninho-v19-ian';", text, count=1)
          sw.write_text(text, encoding='utf-8')
          PY

      - name: Remover workflow temporário e publicar
        run: |
          git rm .github/workflows/atualiza-ian.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html manifest.webmanifest README.md server.js sw.js
          git commit -m "Atualiza identidade do bebê para Ian"
          git push
