name: Diagnóstico Mercado Livre

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-mercadolivre.yml']

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Inspecionar busca
        shell: bash
        run: |
          set +e
          Q='"Carrinho Conforto Bebê Reversível Berço Moisés Dobrável" site:mercadolivre.com.br'
          curl -L -sS -A 'Mozilla/5.0' --get 'https://www.bing.com/search' --data-urlencode "q=$Q" --data 'format=rss' -o /tmp/bing.xml
          curl -L -sS -A 'Mozilla/5.0' --get 'https://www.google.com/search' --data-urlencode "q=$Q" -o /tmp/google.html
          python3 - <<'PY'
          import re, html
          from pathlib import Path
          for fn in ['/tmp/bing.xml','/tmp/google.html']:
              raw=Path(fn).read_text(encoding='utf-8',errors='ignore')
              txt=html.unescape(re.sub(r'<[^>]+>',' ',raw))
              txt=re.sub(r'\\u([0-9a-fA-F]{4})', lambda m: chr(int(m.group(1),16)), txt)
              txt=re.sub(r'\s+',' ',txt)
              print('\nFILE',fn,'LEN',len(txt))
              for needle in ['Carrinho Conforto','Moisés','755,30','798,46','749,80','R$']:
                  pos=txt.lower().find(needle.lower())
                  print('NEEDLE',needle,'POS',pos)
                  if pos>=0: print(txt[max(0,pos-500):pos+1000])
              prices=re.findall(r'R\$\s*[0-9\.]+(?:,[0-9]{2})?',txt)
              print('PRICES',prices[:20])
          PY
