name: Diagnóstico Mercado Livre

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-mercadolivre.yml']

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Testar Bing e Google
        shell: bash
        run: |
          set +e
          Q='"Carrinho Conforto Bebê Reversível Berço Moisés Dobrável" site:mercadolivre.com.br'
          echo '--- BING RSS ---'
          curl -L -sS -A 'Mozilla/5.0' --get 'https://www.bing.com/search' --data-urlencode "q=$Q" --data 'format=rss' -o /tmp/bing.xml
          echo SIZE=$(wc -c < /tmp/bing.xml)
          grep -io -m 10 '.\{0,120\}Carrinho Conforto.\{0,500\}' /tmp/bing.xml || true
          grep -io -m 10 'R\$[^<]\{0,30\}' /tmp/bing.xml || true
          echo '--- GOOGLE ---'
          curl -L -sS -A 'Mozilla/5.0' --get 'https://www.google.com/search' --data-urlencode "q=$Q" -o /tmp/google.html
          echo SIZE=$(wc -c < /tmp/google.html)
          grep -io -m 5 '.\{0,120\}Carrinho Conforto.\{0,500\}' /tmp/google.html || true
          grep -io -m 10 'R\$[^<]\{0,30\}' /tmp/google.html || true
