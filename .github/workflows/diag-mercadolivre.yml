name: Diagnóstico Mercado Livre

on:
  push:
    branches: [main]
    paths: ['.github/workflows/diag-mercadolivre.yml']

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Testar leitor remoto
        shell: bash
        run: |
          set +e
          echo '--- JINA LISTA ---'
          curl -L -sS -A 'Mozilla/5.0' -w '\nHTTP=%{http_code}\n' 'https://r.jina.ai/http://lista.mercadolivre.com.br/carrinho-conforto-bebe-reversivel-berco-moises-dobravel' -o /tmp/jina.txt
          echo SIZE=$(wc -c < /tmp/jina.txt)
          grep -in -m 3 'Carrinho Conforto' /tmp/jina.txt || true
          grep -in -m 10 'R\$' /tmp/jina.txt | head || true
          head -c 3500 /tmp/jina.txt; echo
